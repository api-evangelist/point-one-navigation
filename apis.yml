apis:
- aid: point-one-navigation:polaris-ntrip
  name: Polaris RTK Network (NTRIP)
  description: 'Standards-based NTRIP interface to the Point One Polaris RTK corrections network.
    Clients connect over NTRIP 1.0 or 2.0 to a regional caster, authenticate with Basic auth using a
    unique per-connection identifier, select the ITRF2014 or LOCAL mountpoint, and stream RTCM v3.2
    MSM4 corrections for GPS, GLONASS, Galileo, BeiDou and QZSS. Position is supplied to the caster
    as NMEA GGA. A companion HTTPS endpoint exchanges a single Polaris API key for temporary,
    roughly 24-hour NTRIP credentials so a device fleet can share one key without sharing one
    credential.'
  humanURL: https://support.pointonenav.com/polaris-ntrip-api-docs
  baseURL: https://api.pointonenav.com/api/v1
  tags:
  - RTK
  - NTRIP
  - GNSS
  - Corrections
  - RTCM
  properties:
  - type: Documentation
    url: https://support.pointonenav.com/polaris-ntrip-api-docs
  - type: Authentication
    url: authentication/point-one-navigation-authentication.yml
- aid: point-one-navigation:polaris-native
  name: Polaris Native API (Point One Open)
  description: 'The native Point One corrections protocol. A Polaris API key is POSTed unauthenticated
    to https://api.pointonenav.com/api/v1/auth/token and exchanged for a bearer access token valid for
    604800 seconds; the client then opens a TLS stream to rtk.pointonenav.com:8090, sends an
    Authorization system message carrying the token, and periodically reports its position as an ECEF
    or LLA system message. The server returns RTCM3 corrections outside the system-message envelope.
    Messages use a 0xB5 0x62 framed, little-endian, checksummed binary format.'
  humanURL: https://support.pointonenav.com/native-api-docs
  baseURL: https://api.pointonenav.com/api/v1
  tags:
  - RTK
  - GNSS
  - Corrections
  - RTCM
  - Streaming
  properties:
  - type: Documentation
    url: https://support.pointonenav.com/native-api-docs
  - type: Examples
    url: https://support.pointonenav.com/native-api-examples
  - type: SourceCode
    url: https://github.com/PointOneNav/polaris
  - type: Authentication
    url: authentication/point-one-navigation-authentication.yml
- aid: point-one-navigation:graphql
  name: Point One Platform GraphQL API
  description: 'The single-endpoint GraphQL API behind the Point One web application, covering device
    registration and metadata, tags, seat licenses and entitlements, device profiles (True RTK and
    Virtual RTK correction settings, datum override, correction interval), reference station health
    and sky plots, and Personal Access Token management. Queries, mutations and real-time
    subscriptions share one schema; read-only tokens grant queries and subscriptions while read/write
    tokens are required for mutations.'
  humanURL: https://docs.pointonenav.com/docs/graphql-api/quickstart
  baseURL: https://graphql.pointonenav.com/graphql
  tags:
  - GraphQL
  - Device Management
  - Licensing
  - Observability
  - Reference Stations
