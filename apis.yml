aid: point-one-navigation
name: Point One Navigation
description: 'Point One Navigation operates Polaris, a GNSS RTK corrections network delivering 1-3 cm
  (True RTK) and sub-10 cm (Virtual RTK) positioning across North America, Europe, the UK, Australia,
  New Zealand, Japan and South Korea, alongside FusionEngine, its GNSS/INS sensor-fusion positioning
  engine, and the Atlas and Standard Dev Kit hardware platforms. Developers reach the network three
  ways: a standards-based NTRIP interface that streams RTCM v3.2 MSM4 corrections to any compatible
  receiver, a native Polaris protocol with an API-key-to-bearer-token exchange, and a Personal Access
  Token-authenticated GraphQL platform API for device, tag, license, device-profile and reference
  station management with real-time subscriptions.'
image: https://docs.pointonenav.com/img/point-one-white-logo2.jpg
