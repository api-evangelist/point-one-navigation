concurrency:
  ntrip: >-
    Connection identity is a hard constraint, not a convention: the NTRIP username and the native
    protocol unique_id must be unique across all concurrent sessions on one API key. Two connections
    sharing an identifier conflict and neither works correctly. Max 32 chars (NTRIP) / 36 chars
    (native), alphanumeric plus - and _.
docs_rendering_caveat: >-
  docs.pointonenav.com is a Docusaurus 3.10.1 single-page app whose per-route JavaScript chunks are
  not deployed - /assets/js/17896441.js and every other chunk named in the webpack runtime return
  HTTP 200 with the 3886-byte index shell instead of JavaScript. Consequently no reference page body
  renders, for a crawler or for a human following a deep link. Everything above is taken from
  support.pointonenav.com (server-rendered and readable), from live probes, or from the docs sitemap.
